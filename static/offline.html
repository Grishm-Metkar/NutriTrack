<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#065f46">
  <title>Offline food log — NutriTrack</title>
  <style>
    :root { color-scheme: light; font-family: Inter, ui-sans-serif, system-ui, sans-serif; background: #f0fdf4; color: #172554; }
    * { box-sizing: border-box; }
    body { margin: 0; padding: 28px 16px; }
    main { max-width: 560px; margin: 0 auto; background: white; border: 1px solid #d1fae5; border-radius: 24px; padding: 28px; box-shadow: 0 12px 40px #064e3b12; }
    .mark { display: inline-grid; place-items: center; width: 44px; height: 44px; border-radius: 14px; background: #065f46; color: white; font-weight: 800; }
    h1 { margin: 20px 0 8px; font-size: 28px; }
    p { color: #64748b; line-height: 1.55; }
    label { display: block; margin: 16px 0 6px; font-size: 13px; font-weight: 700; color: #334155; }
    input, select, button { width: 100%; padding: 12px; border: 1px solid #cbd5e1; border-radius: 12px; font: inherit; }
    button { margin-top: 18px; border: 0; background: #059669; color: white; font-weight: 700; cursor: pointer; }
    button:disabled { background: #94a3b8; cursor: not-allowed; }
    #offline-status { margin-top: 14px; padding: 12px; border-radius: 12px; background: #f1f5f9; font-size: 14px; }
    #offline-pending { padding-left: 20px; color: #475569; font-size: 14px; }
    a { color: #047857; font-weight: 600; }
    .small { font-size: 12px; }
  </style>
</head>
<body data-offline-page="1">
  <main>
    <div class="mark" aria-hidden="true">N</div>
    <h1>You’re offline</h1>
    <p>Your food list was saved on this device during your last online visit. Add a meal now; it will sync after you reconnect and sign in again if needed.</p>
    <form id="offline-queue-form">
      <label for="offline-food">Food</label>
      <select id="offline-food" name="food_id" required>
        <option value="">No saved foods available</option>
      </select>
      <label for="offline-grams">Amount (grams)</label>
      <input id="offline-grams" type="number" name="grams" min="1" max="2000" step="1" value="100" required>
      <label for="offline-meal-type">Meal</label>
      <select id="offline-meal-type" name="meal_type">
        <option>Breakfast</option><option>Lunch</option><option>Dinner</option><option>Snack</option>
      </select>
      <button id="offline-save" type="submit" disabled>Save on this device</button>
    </form>
    <p id="offline-status" role="status" aria-live="polite">Checking saved foods…</p>
    <h2>Waiting to sync</h2>
    <ul id="offline-pending"></ul>
    <p class="small"><a href="/">Try NutriTrack again</a> when you have a connection.</p>
  </main>
  <script src="/static/offline-logging.js" defer></script>
</body>
</html>
