{% extends "base.html" %}
{% block title %}Edit {{ food['name'] }} - NutriTrack{% endblock %}
{% block content %}

<div class="max-w-2xl mx-auto px-4 py-10">
  <div class="mb-6">
    <a href="/manage-foods" class="text-gray-500 hover:text-gray-700 text-sm flex items-center gap-1 mb-4">
      <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/>
      </svg>
      Back to Manage Foods
    </a>
    <h1 class="text-3xl font-extrabold text-gray-900">Edit Food</h1>
    <p class="text-gray-500 mt-1">Updating: <strong>{{ food['name'] }}</strong></p>
  </div>

  <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-8">
    <form method="POST" action="/manage-foods/edit/{{ food['id'] }}" class="space-y-5">

      <div>
        <label class="block text-sm font-semibold text-gray-700 mb-1">Food Name <span class="text-red-400">*</span></label>
        <input type="text" name="name" value="{{ food['name'] }}" required
          class="w-full border border-gray-200 rounded-xl px-4 py-2.5 focus:outline-none focus:ring-2 focus:ring-emerald-400"/>
      </div>

      <div>
        <label class="block text-sm font-semibold text-gray-700 mb-1">Category <span class="text-red-400">*</span></label>
        <select name="category" id="categorySelect" onchange="toggleNewCategory(this)"
          class="w-full border border-gray-200 rounded-xl px-4 py-2.5 focus:outline-none focus:ring-2 focus:ring-emerald-400 bg-white">
          {% for cat in categories %}
          <option value="{{ cat['category'] }}" {% if cat['category'] == food['category'] %}selected{% endif %}>{{ cat['category'] }}</option>
          {% endfor %}
          <option value="__new__">+ Create new category</option>
        </select>
        <div id="newCategoryBox" class="hidden mt-2">
          <input type="text" name="new_category" placeholder="Enter new category name"
            class="w-full border border-emerald-300 rounded-xl px-4 py-2.5 focus:outline-none focus:ring-2 focus:ring-emerald-400"/>
        </div>
      </div>

      <div class="grid grid-cols-2 gap-4">
        <div>
          <label class="block text-sm font-semibold text-gray-700 mb-1">Calories (kcal) <span class="text-red-400">*</span></label>
          <input type="number" name="calories" step="0.1" min="0" value="{{ food['calories'] }}" required
            class="w-full border border-gray-200 rounded-xl px-4 py-2.5 focus:outline-none focus:ring-2 focus:ring-emerald-400"/>
        </div>
        <div>
          <label class="block text-sm font-semibold text-gray-700 mb-1">Protein (g) <span class="text-red-400">*</span></label>
          <input type="number" name="protein" step="0.1" min="0" value="{{ food['protein'] }}" required
            class="w-full border border-gray-200 rounded-xl px-4 py-2.5 focus:outline-none focus:ring-2 focus:ring-blue-400"/>
        </div>
        <div>
          <label class="block text-sm font-semibold text-gray-700 mb-1">Carbs (g) <span class="text-red-400">*</span></label>
          <input type="number" name="carbs" step="0.1" min="0" value="{{ food['carbs'] }}" required
            class="w-full border border-gray-200 rounded-xl px-4 py-2.5 focus:outline-none focus:ring-2 focus:ring-orange-400"/>
        </div>
        <div>
          <label class="block text-sm font-semibold text-gray-700 mb-1">Fats (g) <span class="text-red-400">*</span></label>
          <input type="number" name="fats" step="0.1" min="0" value="{{ food['fats'] }}" required
            class="w-full border border-gray-200 rounded-xl px-4 py-2.5 focus:outline-none focus:ring-2 focus:ring-yellow-400"/>
        </div>
      </div>

      <div>
        <label class="block text-sm font-semibold text-gray-700 mb-1">Description <span class="text-gray-400 font-normal">(optional)</span></label>
        <textarea name="description" rows="2"
          class="w-full border border-gray-200 rounded-xl px-4 py-2.5 focus:outline-none focus:ring-2 focus:ring-emerald-400 resize-none">{{ food['description'] or '' }}</textarea>
      </div>

      <div class="flex gap-3 pt-2">
        <button type="submit" class="flex-1 bg-blue-500 hover:bg-blue-600 text-white font-bold py-3 rounded-xl transition-colors">
          Save Changes
        </button>
        <a href="/manage-foods" class="px-6 py-3 bg-gray-100 hover:bg-gray-200 text-gray-700 font-semibold rounded-xl transition-colors">
          Cancel
        </a>
      </div>
    </form>

    <!-- Danger zone -->
    <div class="mt-6 pt-6 border-t border-gray-100">
      <p class="text-xs text-gray-400 mb-2 font-semibold uppercase tracking-wide">Danger Zone</p>
      <form method="POST" action="/manage-foods/delete/{{ food['id'] }}" onsubmit="return confirm('Delete \'{{ food['name'] }}\'? This cannot be undone.')">
        <button type="submit" class="bg-red-50 hover:bg-red-100 text-red-600 font-semibold px-4 py-2 rounded-lg transition-colors text-sm flex items-center gap-2">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/>
          </svg>
          Delete this food
        </button>
      </form>
    </div>
  </div>
</div>

<script>
function toggleNewCategory(select) {
  const box = document.getElementById('newCategoryBox');
  if (select.value === '__new__') {
    box.classList.remove('hidden');
    box.querySelector('input').required = true;
    select.value = '';
  } else {
    box.classList.add('hidden');
    box.querySelector('input').required = false;
    box.querySelector('input').value = '';
  }
}
</script>
{% endblock %}
